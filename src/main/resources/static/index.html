<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattinale AI Chat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-light: #f8fafc;
            --text-gray: #94a3b8;
            --bubble-user: #3b82f6;
            --bubble-ai: #334155;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            height: 100%;
        }

        header {
            padding: 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            line-height: 1.5;
            position: relative;
        }

        .message.user .bubble {
            background-color: var(--bubble-user);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.ai .bubble {
            background-color: var(--bubble-ai);
            color: var(--text-light);
            border-bottom-left-radius: 0.25rem;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 0.25rem;
        }

        .message img {
            max-width: 100%;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid #475569;
        }

        .input-area {
            padding: 1.5rem;
            background-color: var(--chat-bg);
            border-top: 1px solid #334155;
            display: flex;
            gap: 1rem;
        }

        input[type="text"] {
            flex: 1;
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading indicator */
        .typing {
            display: flex;
            gap: 0.25rem;
            padding: 1rem;
            background-color: var(--bubble-ai);
            border-radius: 1rem;
            border-bottom-left-radius: 0.25rem;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <header>
            <div class="status-dot"></div>
            <h1>Mattinale AI Assistant</h1>
        </header>

        <div id="chat-history">
            <!-- Messages will appear here -->
            <div class="message ai">
                <div class="bubble">Ciao! Sono il tuo assistente per il Mattinale. Come posso aiutarti oggi?</div>
                <div class="meta">Adesso</div>
            </div>
        </div>

        <form id="chat-form" class="input-area">
            <input type="text" id="user-input" placeholder="Scrivi un messaggio..." autocomplete="off">
            <button type="submit" id="send-btn">Invia</button>
        </form>
    </div>

    <script>
        // Config
        const API_URL = '/mattinale-ai/rag/ask';
        const CONTEXT_PATH = '/mattinale-ai'; // Used to fix image paths if necessary

        // Session ID generation
        function uuidv4() {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> (+c / 4)).toString(16)
            );
        }
        const sessionId = uuidv4();

        const chatHistory = document.getElementById('chat-history');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // User Message
            appendMessage('user', text);
            input.value = '';
            sendBtn.disabled = true;

            // Loading Indicator
            const loadingId = showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        timestamp: new Date().toISOString(),
                        session_id: sessionId
                    })
                });

                if (!response.ok) throw new Error('Errore nella richiesta');

                const data = await response.json();

                // Remove loading
                document.getElementById(loadingId).remove();

                // AI Response
                appendMessage('ai', data.text, data.receivedAt, data.image);

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).remove();
                appendMessage('ai', 'Mi dispiace, si è verificato un errore durante la comunicazione con il server.');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        });

        function appendMessage(role, text, timestamp, imageUrl) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            let content = `<div class="bubble">${formatText(text)}`;

            if (imageUrl) {
                // Fix relative path if needed
                let finalSrc = imageUrl;
                // If the backend returns /images/foo.png and we are at /mattinale-ai/,
                // we should likely prepend /mattinale-ai if NOT present.
                // However, WebConfig adds handler at /images/** relative to context root.
                // So url is /mattinale-ai/images/...
                // The tool currently returns "/images/..." (absolute string).
                // Requesting /images/... from browser root might fail if deployed under context.
                // We prepend context path if the path starts with / and doesn't have it.
                if (finalSrc.startsWith('/') && !finalSrc.startsWith(CONTEXT_PATH)) {
                    finalSrc = CONTEXT_PATH + finalSrc;
                }
                content += `<br><a href="${finalSrc}" target="_blank"><img src="${finalSrc}" alt="Grafico generato"></a>`;
            }

            content += `</div>`;

            if (timestamp) {
                const time = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                content += `<div class="meta">${time}</div>`;
            }

            div.innerHTML = content;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function showLoading() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `
            <div class="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>`;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return id;
        }

        // Simple markdown-like formatter for newlines and bold
        function formatText(text) {
            if (!text) return '';
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }
    </script>

</body>

</html>
