<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mattinale AI — Visualizzatore immagini Base64</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--accent:#22d3ee}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg);color:var(--text);}
    header{padding:16px 24px;border-bottom:1px solid #1f2937}
    h1{margin:0;font-size:20px}
    main{display:flex;gap:16px; padding:16px; align-items:stretch}
    .col{flex:1; background:var(--card); border:1px solid #1f2937; border-radius:12px; padding:16px; min-height:420px}
    textarea{width:100%; height:260px; resize:vertical; background:#0b1220; color:var(--text); border:1px solid #233046; border-radius:10px; padding:12px}
    .controls{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
    button{background:var(--accent);color:#0b1220;border:0;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:8px}
    .card{background:#0b1220;border:1px solid #233046;border-radius:10px;padding:8px}
    .card img{width:100%;height:auto;display:block;border-radius:8px}
    .meta{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all}
    .hint{font-size:12px;color:var(--muted)}
    label{display:block;margin-bottom:6px;color:var(--muted)}
    input[type="file"]{display:none}
    .link{color:#7dd3fc;text-decoration:none}
  </style>
</head>
<body>
  <header>
    <h1>Mattinale AI · Visualizzatore data:image/*;base64</h1>
  </header>
  <main>
    <section class="col">
      <label for="b64in">Incolla qui la/e stringa/e <code>data:image/...;base64,</code> (una per riga)</label>
      <textarea id="b64in" placeholder="Esempio:\ndata:image/png;base64,iVBORw0KGgoAAA...\ndata:image/jpeg;base64,/9j/4AAQSkZJRgABAQ...\n"></textarea>
      <div class="controls">
        <button id="renderBtn">Visualizza</button>
        <button id="clearBtn" style="background:#f87171;color:#0b1220">Pulisci</button>
        <button id="downloadBtn" title="Scarica tutte le immagini mostrate come file">Scarica tutto</button>
        <span class="hint">Suggerimento: puoi anche trascinare qui un file .txt con i data URL.</span>
      </div>
      <input type="file" id="fileInput" accept=".txt" />
    </section>

    <section class="col">
      <div class="hint">Anteprime generate</div>
      <div id="gallery" class="gallery" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const textarea = document.getElementById('b64in');
    const gallery = document.getElementById('gallery');

    function isDataImageURL(s){
      return /^data:image\/(png|jpeg|jpg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(s.trim());
    }

    function lineToImgCard(dataUrl, idx){
      const card = document.createElement('div');
      card.className = 'card';

      const img = document.createElement('img');
      img.alt = `immagine ${idx+1}`;
      img.referrerPolicy = 'no-referrer';
      img.loading = 'lazy';
      img.src = dataUrl;

      const meta = document.createElement('div');
      const mime = dataUrl.substring(5, dataUrl.indexOf(';'));
      const sizeBytes = Math.floor((dataUrl.length - dataUrl.indexOf(',')) * 3/4);
      const sizeKB = (sizeBytes/1024).toFixed(1);
      meta.className='meta';
      meta.textContent = `${mime} • ~${sizeKB} KB`;

      const a = document.createElement('a');
      a.textContent = 'Scarica';
      a.className = 'link';
      a.download = `immagine_${idx+1}.${mime.split('/')[1].replace('svg+xml','svg')}`;
      a.href = dataUrl;

      const metaRow = document.createElement('div');
      metaRow.style.display='flex';
      metaRow.style.justifyContent='space-between';
      metaRow.style.alignItems='center';
      metaRow.appendChild(meta);
      metaRow.appendChild(a);

      card.appendChild(img);
      card.appendChild(metaRow);
      return card;
    }

    function parseLines(raw){
      // Supporta: ciascuna riga, CSV con virgole, JSON array o testo che contiene data URL
      const out = new Set();
      // Spezza per newline o virgole mantenendo i data URL interi
      const candidates = raw.split(/\n|,(?=data:image\//g);
      for (let c of candidates){
        const m = c.match(/data:image\/(?:png|jpeg|jpg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+/);
        if (m && isDataImageURL(m[0])) out.add(m[0]);
      }
      return Array.from(out);
    }

    function render(){
      gallery.innerHTML = '';
      const lines = parseLines(textarea.value);
      if(lines.length===0){
        gallery.innerHTML = '<div class="hint">Nessun data URL valido trovato.</div>';
        return;
      }
      lines.forEach((url, i)=>{
        gallery.appendChild(lineToImgCard(url, i));
      });
    }

    function clearAll(){
      textarea.value = '';
      gallery.innerHTML = '';
    }

    async function downloadAll(){
      const cards = Array.from(gallery.querySelectorAll('img'));
      if(cards.length===0) return;
      // Scarico sequenzialmente (niente zip per restare senza dipendenze)
      cards.forEach((img, i)=>{
        const a = document.createElement('a');
        a.href = img.src;
        const mime = img.src.substring(5, img.src.indexOf(';'));
        a.download = `immagine_${String(i+1).padStart(2,'0')}.${mime.split('/')[1].replace('svg+xml','svg')}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    }

    document.getElementById('renderBtn').addEventListener('click', render);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('downloadBtn').addEventListener('click', downloadAll);

    // Drag & drop di file .txt con data URL
    const col = document.querySelector('.col');
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.style.outline='2px dashed #22d3ee';});
    col.addEventListener('dragleave', ()=>{ col.style.outline='none';});
    col.addEventListener('drop', async (e)=>{
      e.preventDefault(); col.style.outline='none';
      const f = e.dataTransfer.files?.[0];
      if(!f) return; 
      const text = await f.text();
      textarea.value = text;
      render();
    });
  </script>
</body>
</html>
