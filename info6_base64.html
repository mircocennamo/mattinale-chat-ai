<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mattinale AI</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; margin:0; padding:24px; background:#0f172a; color:#e5e7eb}
    h1,h2,h3,h4{margin:0 0 8px 0}
    .row{display:flex; gap:16px; flex-wrap:wrap}
    .card{flex:1; min-width:280px; background:#111827; border:1px solid #1f2937; border-radius:12px; padding:16px}
    button{background:#22d3ee; color:#0b1220; border:0; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:600}
    .muted{color:#94a3b8; font-size:12px}
    textarea{width:100%; height:160px; resize:vertical; background:#0b1220; color:#e5e7eb; border:1px solid #233046; border-radius:10px; padding:10px}
    .gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:12px}
    .img-card{background:#0b1220; border:1px solid #233046; border-radius:10px; padding:8px}
    .img-card img{width:100%; height:auto; display:block; border-radius:8px}
    .meta{font-size:12px; color:#94a3b8; margin-top:6px; word-break:break-all}
  </style>
</head>
<body>
  <h1>Mattinale AI</h1>
  <h2>Mattinale AI</h2>
  <div class="row">
    <div class="card">
      <h3>Chat</h3>
      <div class="muted">(interfaccia come nel file originale)</div>
    </div>
    <div class="card">
      <h3>Carica File</h3>
      <button>Carica</button>
    </div>
    <div class="card">
      <h3>Pulisci chat</h3>
      <button>Pulisci</button>
    </div>
    <div class="card">
      <h3>Invia</h3>
      <button>Invia</button>
    </div>
  </div>

  <h4>Carica file Excel</h4>
  <button>Carica</button>

  <h4>Carica file PDF</h4>
  <button>Carica</button>

  <!-- Sezione aggiunta: Visualizzazione immagini Base64 -->
  <div class="card" style="margin-top:16px">
    <h3>Visualizzazione immagini Base64</h3>
    <p class="muted">Incolla uno o più data URL (una per riga) oppure incolla direttamente risposte del tipo <code>data:image/png;base64,...</code>.</p>
    <textarea id="b64in" placeholder="Esempio:
data:image/png;base64,iVBORw0KGgoAAA...
data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ...
"></textarea>
    <div style="display:flex; gap:8px; margin-top:8px">
      <button id="renderBtn">Visualizza</button>
      <button id="clearBtn" style="background:#f87171">Pulisci</button>
    </div>
    <div id="gallery" class="gallery" aria-live="polite"></div>
  </div>

  <script>
    const textarea = document.getElementById('b64in');
    const gallery = document.getElementById('gallery');

    function isDataImageURL(s){
      return /^data:image\/(png|jpeg|jpg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(s.trim());
    }

    function parseLines(raw){
      const out = new Set();
      const candidates = raw.split(/
|,(?=data:image\//g);
      for (let c of candidates){
        const m = c.match(/data:image\/(?:png|jpeg|jpg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+/);
        if (m && isDataImageURL(m[0])) out.add(m[0]);
      }
      return Array.from(out);
    }

    function lineToCard(dataUrl, idx){
      const card = document.createElement('div');
      card.className = 'img-card';
      const img = document.createElement('img');
      img.alt = `immagine ${idx+1}`;
      img.loading = 'lazy';
      img.src = dataUrl;
      const mime = dataUrl.substring(5, dataUrl.indexOf(';'));
      const sizeBytes = Math.floor((dataUrl.length - dataUrl.indexOf(',')) * 3/4);
      const sizeKB = (sizeBytes/1024).toFixed(1);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${mime} • ~${sizeKB} KB`;
      card.appendChild(img);
      card.appendChild(meta);
      return card;
    }

    function render(){
      gallery.innerHTML = '';
      const lines = parseLines(textarea.value);
      if(lines.length===0){
        gallery.innerHTML = '<div class="meta">Nessun data URL valido trovato.</div>';
        return;
      }
      lines.forEach((url, i)=> gallery.appendChild(lineToCard(url, i)));
    }

    function clearAll(){ textarea.value=''; gallery.innerHTML=''; }

    document.getElementById('renderBtn').addEventListener('click', render);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    // Quality of life: se incolli una risposta che contiene data URL, le estraiamo automaticamente
    textarea.addEventListener('paste', (e)=>{
      setTimeout(()=>{ render(); }, 0);
    });
  </script>
</body>
</html>
